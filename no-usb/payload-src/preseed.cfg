# fiaOS Debian 12 preseed — no-USB edition. Lives at /preseed.cfg inside fiaos.cpio.gz (auto-loaded by the installer).
# The installer runs entirely from RAM and downloads Debian from the internet, so wiping the drive (incl. the FIAOSINST partition) is safe.
# NOT preseeded on purpose: Wi-Fi network + password, admin password, the disk choice, and the final "Write changes to disks?" confirmation.
# Passwords are NOT preseeded: the installer will prompt for the admin user's password.
d-i debian-installer/locale string en_AU.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i netcfg/choose_interface select auto
# Wi-Fi: the installer will list networks and ask for the password (or use phone USB tethering: it appears as a wired 'usb0'/'enx…' interface).
d-i netcfg/wireless_wep string
d-i netcfg/get_hostname string fiaos
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
# Accounts: no root password (sudo), one admin user; password asked interactively
d-i passwd/root-login boolean false
d-i passwd/user-fullname string fiaOS Admin
d-i passwd/username string fiadmin
# Partitioning: guided, whole disk, one partition. You WILL still see the disk choice and the red
# "Write the changes to disks?" screen — nothing is erased until you answer Yes there.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-efi/non_efi_system boolean true
# (intentionally NOT set: partman-auto/disk, partman/confirm, partman/confirm_nooverwrite)
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo curl unzip network-manager ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true
# Install fiaOS automatically. If anything fails here, a first-boot service retries (needs internet).
d-i preseed/late_command string \
  cp -a /fiaos /target/root/fiaos; \
  cp /fiaos/no-usb/payload-src/fiaos-firstboot.service /target/etc/systemd/system/; \
  in-target systemctl enable fiaos-firstboot.service; \
  in-target sh -c 'FIAOS_NONINTERACTIVE=1 bash /root/fiaos/linux/install-fiaos.sh > /var/log/fiaos-install.log 2>&1' || true
d-i finish-install/reboot_in_progress note
