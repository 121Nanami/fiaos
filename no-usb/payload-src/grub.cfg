# fiaOS no-USB installer menu (embedded in BOOTX64.EFI and also read from the FIAOSINST partition)
set timeout=15
set default=0
insmod part_gpt
insmod fat
insmod gzio
search --no-floppy --label FIAOSINST --set=root
if [ -z "$root" ]; then search --no-floppy --file /fiaos-installer.marker --set=root; fi
set gfxpayload=keep

menuentry "Install fiaOS  (ERASES the whole internal drive - you will be asked to confirm)" {
  linux  /debian/linux locale=en_AU.UTF-8 keymap=us quiet
  initrd /debian/initrd.gz /debian/firmware.cpio.gz /debian/fiaos.cpio.gz
}
menuentry "Install fiaOS - expert/rescue mode" {
  linux  /debian/linux locale=en_AU.UTF-8 keymap=us priority=low
  initrd /debian/initrd.gz /debian/firmware.cpio.gz /debian/fiaos.cpio.gz
}
menuentry "Back to Windows (change nothing)" {
  search --no-floppy --file /EFI/Microsoft/Boot/bootmgfw.efi --set=esp
  chainloader ($esp)/EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry "UEFI firmware settings" { fwsetup }
